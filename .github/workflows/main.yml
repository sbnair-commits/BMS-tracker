name: BookMyShow Tracking Automation

on:
  schedule:
    # This triggers the script automatically every 5 minutes 24/7
    - cron: '*/5 * * * *'
  workflow_dispatch: # This adds a manual button so you can run it right now to test

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Execute Tracker Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tracker.py
